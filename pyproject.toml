[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "water-treatment-research"
version = "0.2.0"
description = "Evidence-grounded literature extraction for coupled evaporation and catalysis"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3", "pypdf>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
vision = ["pypdfium2>=4.30,<6", "Pillow>=10,<13"]
graph = ["neo4j>=5.26,<6"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.scripts]
wt = "watertreatment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
watertreatment = ["web_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

